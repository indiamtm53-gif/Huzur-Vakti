name: Android APK Oluştur

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: JDK kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle wrapper'a çalıştırma izni ver
        run: chmod +x ./gradlew

      - name: Debug APK oluştur
        run: ./gradlew assembleDebug

      # Release APK istersen aşağıdakini de ekleyebilirsin:
      # - name: Release APK oluştur
      #   run: ./gradlew assembleRelease

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
